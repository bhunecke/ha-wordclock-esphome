substitutions:
  devicename: wordclock
  friendly_name: "Wordclock"

esphome:
  name: ${devicename}
  # on_boot:
  #   priority: -100
  #   then:
  #     - light.turn_on: 
  #         id: wordclock_light

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret wordclock__encryption_key
  reboot_timeout: 30min
  services:
    - service: setled
      variables:
        number: int
        red: int
        blue: int
        green: int
      then:
        - lambda: |-
            id(my_wordclock)->on_setled(number, red, blue, green);

ota:
  - platform: esphome
    password: !secret wordclock__ota_secret

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0min

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename}"
    password: !secret wordclock__ap_password

captive_portal:

external_components:
  # source: github://bhunecke/ha-wordclock-esphome@feature/esp-idf-migration
  source:
    type: local
    path: components

light:
  - platform: esp32_rmt_led_strip
    name: ${friendly_name}
    id: wordclock_light
    pin: GPIO22
    num_leds: 125
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

time:
  - platform: homeassistant
    id: current_time

wordclock:
  id: my_wordclock
  time_id: current_time
  light_id: wordclock_light
